blocks:
  - type: gallery
    title: "Build process"
    items:
      - src: "media/projects/line-follower-robot/build-1.jpg"
        title: "Bare PCB"
        caption: "First revision board fresh off the mill."
      - src: "media/projects/line-follower-robot/build-2.jpg"
        title: "Populated board"
        caption: "Sensor array and motor drivers soldered in."
      - src: "media/projects/line-follower-robot/build-3.jpg"
        title: "Chassis assembly"
        caption: "3D-printed chassis with motors mounted."

  - type: text
    content: >
      The first revision used a fixed-gain proportional controller,
      which oscillated badly on tight corners. Moving to a full PID
      loop with gain scheduling based on error magnitude let the
      robot hold near-top speed on straights while slowing smoothly
      into turns.

  - type: photo
    src: "media/projects/line-follower-robot/pid-tuning.jpg"
    title: "Tuning session"
    caption: "Logging sensor error against wheel speed to hand-tune PID gains."

  - type: text
    content: >
      Final lap times improved by 38% over the proportional-only
      version, with zero track departures across 20 consecutive
      test laps.

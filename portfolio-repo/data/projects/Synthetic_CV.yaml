slug: Synthetic_CV
title: "CAD to CV model suite"
subtitle: "Synthetic Dataset Generator and Computer Vision Model Training Suite that created detector "
dates: "May 2025 – Jul 2025"
tags: ["Dataset Engineering", "Computer Vision", "Neural Network Training"]
tools: ["Open CV", "RESNET", "Ultralytics YOLO", "Pytorch"]

short_description: >
  This project includes a synthetic dataset generator able to create thousands of unique, annotated training images of spesific parts from cad models in minutes. A smart dataloader able to train 
  Ultralytics YOLO CV models on randomized data sets based on a learning curve optimizing cirriculum. It can create a pair of neural networks, a YOLO based bounding box detector,and a RESNET based 3D angular orientation regression model.
 

skills_demonstrated:
  - "Dataset Engineering"
  - "Computer Vision Model Training"
  - "Neural Network Manipulation"


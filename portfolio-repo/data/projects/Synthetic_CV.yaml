  - type: text
    content: >
      The roposity was a modular tool for rapidly creating and exporting computer vision models custom to company parts using only a CAD file of the part.
      It allowed the user to upload CAD files and start the automatic generation/training procedure within minutes, completely bypassing the hours of capturing and annotating training images.
      It was able to create models that preformed better, overall, and on edge cases, than hand trained alternatives.

  - type: video
    src: "media/projects/Synthetic_CV/toss-1.mp4"
    title: "Real Time Detection and Orientation Regression"
    caption: ""
    play_type: button

  
  - type: text
    content: >
      Using PyRender to overlay parts ontop of background images, thousands of unique, annotated training images could be created instantly, completely removing the
      tedius, hours long proccess of annotating images for computer vision model training. 

  - type: photo
    src: "media/projects/Synthetic_CV/example-render.jpg"
    title: "Example Training Rendering"
    caption: "Randomized training image, can be generated in seconds with annotation."

  - type: text
    content: >
      Datasets could be generated using many randomizing features to strengthen the models edge case preformance. Textures, color, lighting, shadows, blur, size, orientation, and visibility could all be 
      randomized per part, and scenes could be blured, noized, cropped, and augmented for extra randomization. 
      Distractors were also randomized to prevent false positive detections and the model learning on static sceness

  - type: gallery
    title: "Effect of Cirriculum on Model Training"
    items:
      - src: "media/projects/Synthetic_CV/pre-cirriculum-training-crop.png"
        title: "Without Cirriculum"
        #caption: "C."
      - src: "media/projects/Synthetic_CV/post-cirriculum-training-crop.png"
        title: "With Cirriculum"
        #caption: "Includes."

  - type: text
    content: >
      Implamenting a smart dataloader increased both the speed and accuracy of training the orientation model. 
      The cirruculum was deloped by calculating an overall abstraction score for each image based on the randomized values that made up the image.
      Images with many annotated parts, high contrast, low blur, and less distractors were given a high abstraction score, and were trained in earlier epochs. 
      This allowed the model to converge rapidly, within the first quarter of training the model has a good understanding of the parts it is looking for. 
      Alternatively, images with many distractors, fewer parts, low contrast, and more blur/distortion were given a low abstraction score, and were fed during the later portion of training. 
      These "realer" images fortified the model, to not just understand the features of the part, but to be able to infer when parts were less visible, or blured. They also 
      enforced which features were not detections using distractors to prevent false positives.


  - type: gallery
    title: "Abstracted Rendering vs Real Rendering"
    items:
      - src: "media/projects/Synthetic_CV/abstract-2.jpg"
        title: "High Abstraction Rendering"
        caption: "Many parts that allow fast learning."
      - src: "media/projects/Synthetic_CV/real-2.jpg"
        title: "Low Abstraction Rendering"
        caption: "Simulates actual deployment images reinforcing model bahavior."


  - type: text
    title: "Project Outcome"
    content: >
      Models that were generated can be used for any application that requires 6D pose of a part. 
      Applications could include part inspection, line validation/part tracking, typical robotics and humanoid robotics.


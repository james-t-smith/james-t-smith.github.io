# ============================================================
# Single source of truth for visual theme.
# build.py reads this and generates:
#   site/css/theme-vars.css   (CSS custom properties)
#   latex/shared/theme.sty    (xcolor + font setup + size commands)
# Change a value here, run scripts/build.py, both outputs update.
# ============================================================

colors:
  graphite-900: "#1C1F22"   # near-black, blue-tinted — primary text / dark surfaces
  steel-700:    "#3D4650"   # secondary text, dividers on dark
  slate-400:    "#7C8894"   # muted text, captions
  fog-100:      "#EDEFF1"   # light neutral background
  paper:        "#FFFFFF"   # cards / panels on light background
  blueprint-500: "#235789"  # single accent — links, active states, rules
  signal-amber:  "#D98E3B"  # sparse use only — CTA / current-state highlight

fonts:
  # Font choices — `family` must exactly match a font name already
  # installed on whatever machine compiles the PDFs (the name as shown
  # in Windows' Font Settings / macOS Font Book), OR a Google Fonts
  # family if you re-enable the @import in site/css/style.css. Pick any
  # family below for each slot (or your own) and re-run scripts/build.py
  # — this is the exact same mechanism for resume.tex, portfolio.tex,
  # and coverletter.tex, since all three share this one theme.sty.
  #
  #   DISPLAY / HEADING (bold, used at larger sizes) — good options:
  #     Arial, Helvetica, "Segoe UI", Calibri, Verdana, Tahoma,
  #     "Trebuchet MS", "Century Gothic", Georgia (serif), Cambria (serif)
  #
  #   BODY (readable at small sizes) — good options:
  #     Arial, "Segoe UI", Calibri, Verdana, Georgia,
  #     "Times New Roman", Cambria, "Book Antiqua"
  #
  #   MONO (metadata labels, tags) — good options:
  #     "Courier New", Consolas, "Lucida Console", "Cascadia Mono",
  #     "Cascadia Code", Menlo (macOS), Monaco (macOS)
  #
  # Arial / Calibri / Segoe UI / Verdana / Georgia / Times New Roman /
  # Cambria and Courier New / Consolas all ship by default on Windows.
  # On macOS, Helvetica / Menlo are the closest native equivalents to
  # Arial / Courier New. If whatever you pick genuinely isn't installed
  # on the machine compiling the PDFs, theme.sty's automatic fallback
  # to DejaVu Sans / DejaVu Sans Mono keeps the build from failing —
  # you'll just get a plainer look than intended, not an error.
  display:
    family: "Arial"
    weights: [700]
  body:
    family: "Arial"
    weights: [400]
  mono:
    family: "Courier New"
    weights: [400]
    usage: "metadata labels, tags, code, data"

# Type scale — edit these to change text sizing sitewide/PDF-wide without
# touching any CSS or LaTeX by hand. "site" values are CSS sizes (any
# unit); "pdf" values must be valid LaTeX font-size commands.
type_scale:
  hero_title:      { site: "3.2rem",   pdf: "\\Huge" }
  project_title:   { site: "2rem",     pdf: "\\LARGE" }
  section_heading: { site: "0.95rem",  pdf: "\\Large" }
  meta_label:      { site: "0.85rem",  pdf: "\\normalsize" }   # DATES/TAGS/TOOLS — bigger + no box now
  body:            { site: "1.05rem",  pdf: "\\normalsize" }
  caption:         { site: "0.88rem",  pdf: "\\small" }
  small:           { site: "0.78rem",  pdf: "\\footnotesize" }
line_height:
  heading: 1.1
  body: 1.6

layout:
  content_max_width: "1100px"
  grid_unit: "8px"
  divider_style: "dimension-line"   # thin rule with small tick marks at each end

radius:
  base: "3px"    # deliberately near-square — drafting-tool feel, not SaaS rounded cards

media:
  # Uniform framing applied to every embedded photo/video/model/carousel item.
  # Both of these are DEFAULTS — any photo/video/stl/gallery/carousel block
  # can override background/border for just that item (see README).
  frame_bg: "paper"           # letterbox background behind contain-fit media (was graphite-900 — a dark box behind every photo read as "ugly"; paper blends with the card/page instead)
  border_enabled: false       # borders are opt-in now, not automatic
  border_color: "steel-700"   # used only when border_enabled/an item's border: true
  border_width: "1px"
  max_height: "70vh"          # media never grows taller than this regardless of aspect ratio

interaction:
  # hover/focus treatment for clickable elements (cards, links, buttons, carousel controls)
  glow_color: "blueprint-500"
  glow_strength: "0 0 0 3px"   # box-shadow spread used for the glow ring
  lift: "-3px"                  # translateY on hover for cards
  transition: "160ms ease"

pdf:
  # Background color of the PORTFOLIO PDF specifically (latex/portfolio/
  # portfolio.tex). resume.tex and coverletter.tex intentionally stay
  # plain white always — that's the expected norm for an ATS-scanned
  # resume and a formal letter, so they're not configurable here.
  # Use any name from `colors:` above, or a standard color name like
  # "white" / "black".
  background: "fog-100"
  # Default body text color for the portfolio PDF. If you pick a dark
  # background above, set this to something light (e.g. "fog-100")
  # so text stays legible — colors here aren't auto-contrasted for you.
  text_color: "graphite-900"
